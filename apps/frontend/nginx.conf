# Nginx configuration for Apollo Chat frontend
# Serves Vue.js static files and proxies API requests to backend

# Run as non-root user for security
user nginx;

# Auto-detect number of CPU cores
worker_processes auto;

# Error log location
error_log /var/log/nginx/error.log notice;

# Process ID file
pid /var/run/nginx.pid;

events {
    # Maximum simultaneous connections per worker
    worker_connections 1024;
}

http {
    # Include MIME type definitions
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Optimize file sending
    sendfile on;
    tcp_nopush on;

    # Keep connections alive for better performance
    keepalive_timeout 65;

    # Enable gzip compression for faster transfers
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        # Listen on port 8080 (host network mode - avoiding privileged port 80)
        listen 8080;
        server_name localhost;

        # Root directory for static files (Vue.js build output)
        root /usr/share/nginx/html;
        index index.html;

        # =================================================================
        # Uploads Proxy - Serve uploaded files from backend
        # =================================================================
        # Separate location for uploads (more specific, matched first)
        # /api/uploads/file.jpg → http://127.0.0.1:3000/uploads/file.jpg
        location ^~ /api/uploads/ {
            proxy_pass http://127.0.0.1:3000/uploads/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # =================================================================
        # API Proxy - Forward /api/* requests to backend
        # =================================================================
        # Using host network mode, backend is on localhost:3000
        location /api/ {
            # Remove /api prefix when forwarding to backend
            # e.g., /api/chat becomes /chat on the backend
            rewrite ^/api(/.*)$ $1 break;

            # Forward to backend on localhost (host network mode)
            proxy_pass http://127.0.0.1:3000;

            # Pass original request headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # =============================================================
            # SSE (Server-Sent Events) support for streaming chat responses
            # =============================================================
            # Disable buffering so SSE events stream immediately
            proxy_buffering off;
            proxy_cache off;

            # Don't buffer the response
            proxy_set_header Connection '';
            proxy_http_version 1.1;

            # Increase timeouts for long-running chat requests
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;

            # Disable chunked transfer encoding issues
            chunked_transfer_encoding off;
        }

        # =================================================================
        # Static file serving for Vue.js SPA
        # =================================================================
        location / {
            # Try to serve the requested file directly
            # If not found, fall back to index.html (for Vue Router)
            # This enables client-side routing to work correctly
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets for better performance
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
