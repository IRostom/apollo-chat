# Docker Compose configuration for Apollo Chat
# Run with: docker-compose up --build

services:
  # Backend API service
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    networks:
      - frontnet
    environment:
      # Database path - points to mounted volume
      - DB_FILE_NAME=file:/app/data/history.db
      # Optional: set for cloud or host-accessible Ollama endpoint
      # If omitted, backend falls back to http://localhost:11434
      - OLLAMA_HOST=${OLLAMA_HOST:-}
      - PORT=3000
      # Ollama API key for web search functionality
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      # S3 configuration
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_REGION=${S3_REGION}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_USE_SSL=${S3_USE_SSL}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE}
      - S3_TLS_INSECURE=${S3_TLS_INSECURE}
      # Clerk configuration
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      # Provider configuration
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      # Named volume for database persistence
      - db-data:/app/data
      # Mount uploads directory for file persistence
      - uploads-data:/app/apps/backend/uploads
      # Dev-only: grants host Docker access for code execution (unsafe for untrusted prod)
      - /var/run/docker.sock:/var/run/docker.sock
    # Health check to ensure backend is ready before frontend starts
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:3000/healthz",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Frontend service
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
    networks:
      - frontnet
    # Wait for backend to be healthy before starting
    depends_on:
      backend:
        condition: service_healthy

# Named volumes - Docker manages where these are stored on disk
# Data persists even after 'docker-compose down'
# Use 'docker-compose down -v' to delete volumes
volumes:
  db-data:
    name: apollo-chat_db-data
  uploads-data:
    name: apollo-chat_uploads-data

networks:
  frontnet:
    driver: bridge
